##
## Project IronMan — Voice Stack
##
## Default services (no profile needed):
##   whisper-cpp   http://localhost:8178  POST /asr   (STT)
##   piper         http://localhost:5002  POST /api/tts (TTS)
##   openwakeword  TCP  localhost:10400              (wake word)
##
## Optional LiveKit transport (add --profile livekit):
##   livekit       http://localhost:7880
##   voice-agent   (connects livekit + whisper + piper)
##
## Quick start (from repo root):
##   docker compose -f infra/docker-compose.voice.yml up -d
##
## With LiveKit:
##   docker compose -f infra/docker-compose.voice.yml --profile livekit up -d
##
## Piper voice model (~60 MB) — download once, mounted read-only:
##   mkdir -p models/piper
##   curl -L -o models/piper/en_US-lessac-medium.onnx \
##     "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx"
##   curl -L -o models/piper/en_US-lessac-medium.onnx.json \
##     "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json"
##
## Whisper model (~150 MB) is downloaded automatically on first container start
## and cached in the whisper_cache Docker volume.
##

services:

  # ── STT ────────────────────────────────────────────────────────────────────
  # onerahmet/openai-whisper-asr-webservice: POST /asr with audio_file field
  # Model downloads automatically on first start (~150 MB) into whisper_cache.
  whisper-cpp:
    image: onerahmet/openai-whisper-asr-webservice:latest
    ports:
      - "8178:9000"
    environment:
      - ASR_MODEL=base.en
      - ASR_ENGINE=openai_whisper
    volumes:
      - whisper_cache:/root/.cache/whisper
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/"]
      interval: 15s
      timeout: 10s
      retries: 8
    restart: unless-stopped
    networks:
      - ironman

  # ── TTS ────────────────────────────────────────────────────────────────────
  # Custom piper HTTP wrapper: POST /api/tts  returns audio/wav
  # Requires models/piper/en_US-lessac-medium.onnx (see header comment).
  piper:
    build:
      context: ./piper-http
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    volumes:
      - ../models/piper:/models:ro
    environment:
      - PIPER_VOICE=en_US-lessac-medium
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5002/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ironman

  # ── Wake word ──────────────────────────────────────────────────────────────
  # Wyoming TCP protocol on :10400; health-checked via TCP connect in the API.
  openwakeword:
    image: rhasspy/wyoming-openwakeword:latest
    ports:
      - "10400:10400"
    command: --preload-model hey_jarvis --debug
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'echo > /dev/tcp/localhost/10400' 2>/dev/null && echo ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ironman

  # ── LiveKit transport (optional — add --profile livekit to enable) ─────────
  livekit:
    profiles: [livekit]
    image: livekit/livekit-server:latest
    command: --config /etc/livekit/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50010:50000-50010/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ironman

  # ── Voice agent (optional — requires livekit profile) ─────────────────────
  voice-agent:
    profiles: [livekit]
    build:
      context: ../apps/voice-agent
      dockerfile: Dockerfile
    environment:
      - VOICE_LIVEKIT_URL=ws://livekit:7880
      - VOICE_LIVEKIT_API_KEY=devkey
      - VOICE_LIVEKIT_API_SECRET=secret
      - VOICE_STT_PROVIDER=whisper_cpp
      - VOICE_WHISPER_CPP_URL=http://whisper-cpp:9000
      - VOICE_TTS_PROVIDER=piper
      - VOICE_PIPER_URL=http://piper:5002
      - VOICE_API_BASE_URL=http://api:8000
      - VOICE_WAKE_WORD_ENABLED=true
      - VOICE_WAKE_WORD_PHRASE=hey jarvis
    depends_on:
      livekit:
        condition: service_healthy
      whisper-cpp:
        condition: service_healthy
      piper:
        condition: service_healthy
      openwakeword:
        condition: service_healthy
    command: voice-agent --transport livekit
    networks:
      - ironman

networks:
  ironman:
    external: true
    name: ironman_ironman

volumes:
  whisper_cache:
