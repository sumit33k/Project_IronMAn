##
## Project IronMan — Voice Production Stack
##
## Usage:
##   docker compose -f infra/docker-compose.yml -f infra/docker-compose.voice.yml up
##
## Quick start (from repo root):
##   mkdir -p models/whisper models/piper
##
##   # Whisper model (~150 MB)
##   curl -L -o models/whisper/ggml-base.en.bin \
##     https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
##
##   # Piper voice model (~60 MB)
##   curl -L -o models/piper/en_US-lessac-medium.onnx \
##     "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx"
##   curl -L -o models/piper/en_US-lessac-medium.onnx.json \
##     "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json"
##
## Services exposed:
##   whisper-cpp  http://localhost:8178  POST /inference  (STT)
##   piper        http://localhost:5002  POST /api/tts    (TTS)
##   openwakeword TCP  localhost:10400               (wake word)
##   livekit      http://localhost:7880               (transport)
##   voice-agent  (internal — connects to all of the above)
##

services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ironman

  whisper-cpp:
    image: ghcr.io/ggerganov/whisper.cpp:server
    ports:
      - "8178:8178"
    volumes:
      - ../models/whisper:/models:ro
    command: -m /models/ggml-base.en.bin --host 0.0.0.0 --port 8178
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8178/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ironman

  # HTTP wrapper around the piper binary — exposes POST /api/tts
  # Build: docker compose -f infra/docker-compose.voice.yml build piper
  piper:
    build:
      context: ./piper-http
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    volumes:
      - ../models/piper:/models:ro
    environment:
      - PIPER_VOICE=en_US-lessac-medium
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5002/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ironman

  # openWakeWord — always-on "hey jarvis" detector
  # Wyoming protocol on TCP 10400; health checked via TCP connect in API
  openwakeword:
    image: rhasspy/wyoming-openwakeword:latest
    ports:
      - "10400:10400"
    command: --preload-model hey_jarvis --debug
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'echo > /dev/tcp/localhost/10400' 2>/dev/null && echo ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ironman

  voice-agent:
    build:
      context: ../apps/voice-agent
      dockerfile: Dockerfile
    environment:
      - VOICE_LIVEKIT_URL=ws://livekit:7880
      - VOICE_LIVEKIT_API_KEY=devkey
      - VOICE_LIVEKIT_API_SECRET=secret
      - VOICE_STT_PROVIDER=whisper_cpp
      - VOICE_WHISPER_CPP_URL=http://whisper-cpp:8178
      - VOICE_TTS_PROVIDER=piper
      - VOICE_PIPER_URL=http://piper:5002
      - VOICE_API_BASE_URL=http://api:8000
      - VOICE_WAKE_WORD_ENABLED=true
      - VOICE_WAKE_WORD_PHRASE=hey jarvis
    depends_on:
      livekit:
        condition: service_healthy
      whisper-cpp:
        condition: service_healthy
      piper:
        condition: service_healthy
      openwakeword:
        condition: service_healthy
    command: voice-agent --transport livekit
    networks:
      - ironman

networks:
  ironman:
    external: true
    name: ironman_ironman
